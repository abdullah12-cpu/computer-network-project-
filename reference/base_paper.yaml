# Base paper: Udurume, Shakhov & Koo (2026), Scientific Reports 16:32576,
# doi:10.1038/s41598-025-34334-3. Numbers as reported (fractions, not %).
# "f1" is the paper's F1-score; the paper does not say which average it uses.
# Used by scripts/compare_base.py.

reported:
  unsw:
    binary:                # Table 2
      cnn:  {accuracy: 0.975, precision: 0.979, recall: 0.971, f1: 0.975}
      lstm: {accuracy: 0.958, precision: 0.964, recall: 0.972, f1: 0.968}
    multiclass:            # Table 3
      cnn:  {accuracy: 0.941, precision: 0.943, recall: 0.938, f1: 0.940}
      lstm: {accuracy: 0.926, precision: 0.931, recall: 0.942, f1: 0.936}
  wustl:
    binary:                # Table 4
      cnn:  {accuracy: 0.959, precision: 0.962, recall: 0.950, f1: 0.956}
      lstm: {accuracy: 0.943, precision: 0.950, recall: 0.932, f1: 0.941}
    multiclass:            # Table 5
      cnn:  {accuracy: 0.934, precision: 0.931, recall: 0.926, f1: 0.928}
      lstm: {accuracy: 0.917, precision: 0.910, recall: 0.904, f1: 0.906}

# Per-class recall of the paper's CNN, read from its own confusion matrices.
per_class_recall:
  unsw_multiclass:         # Fig. 6
    Analysis: 0.067        # 40 / 598
    Backdoor: 0.000        # 0 / 529
    DoS: 0.001             # 4 / 3568
    Exploits: 0.958        # 9735 / 10158
    Fuzzers: 0.781         # 4201 / 5382
    Generic: 0.972         # 11738 / 12075
    Normal: 0.914          # 15332 / 16772
    Reconnaissance: 0.499  # 1554 / 3115
    Shellcode: 0.000       # 0 / 368
    Worms: 0.000           # 0 / 38
  wustl_multiclass:        # Fig. 8
    Backdoor: 0.762        # 32 / 42
    CommInj: 0.942         # 49 / 52
    DoS: 1.000             # 15661 / 15661
    Reconn: 0.998          # 1646 / 1649
    Normal: 1.000          # 221477 / 221490

# False-positive rate on normal traffic, from the paper's confusion matrices.
fpr:
  unsw_binary: 0.0838      # Fig. 4: 1405 / 16772 normal flows flagged

efficiency:                # Table 8 (hardware not stated)
  cnn: {latency_ms_per_flow: 2.18, memory_mb: 22.1, params_m: 1.02, train_s_per_epoch: 9.1}
  shap_overhead_s: 3.8

explanation:
  fidelity_top3_masked: {f1_full: 0.960, f1_masked: 0.874}   # sttl, ct_dst_src_ltm, dwin zeroed
  stability_top10_jaccard: [0.84, 0.89]                       # 5 bootstraps
  topk: {k: 10, f1: 0.932, train_time_change: -0.42, inference_time_change: -0.38}   # text says k = 15

drift_and_unseen_attacks: not evaluated

# What the base paper's own notebooks print when run (reference/base_notebook_outputs.txt).
base_code_output:
  unsw:
    binary:
      cnn:  {accuracy: 0.968, macro_f1: 0.96, weighted_f1: 0.97}
      lstm: {accuracy: 0.95, macro_f1: 0.94, weighted_f1: 0.95}
    multiclass:
      cnn:  {accuracy: 0.81, macro_f1: 0.41, weighted_f1: 0.78}
      lstm: {accuracy: 0.78, macro_f1: 0.39, weighted_f1: 0.75}
  wustl:
    multiclass:
      cnn:  {accuracy: 1.00, macro_f1: 0.95, weighted_f1: 1.00}   # 'Target' label left in the inputs
